name: macOS Intel build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      CFLAGS: '-O2 -arch x86_64'
      LDFLAGS: '-arch x86_64'
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: brew install autoconf automake
      - name: Build static libpcap
        run: |
          curl -fsSLo "$RUNNER_TEMP/libpcap.tar.gz" https://www.tcpdump.org/release/libpcap-1.10.5.tar.gz
          echo '37ced90a19a302a7f32e458224a00c365c117905c2cd35ac544b6880a81488f0  '"$RUNNER_TEMP/libpcap.tar.gz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/libpcap.tar.gz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/libpcap-1.10.5"
          ./configure --prefix="$RUNNER_TEMP/pcap" --disable-shared
          make -j3
          make install
      - name: Configure and build
        run: |
          autoreconf --install
          ./configure --prefix=/usr/local \
            CPPFLAGS="-I$RUNNER_TEMP/pcap/include" \
            LIBS="$RUNNER_TEMP/pcap/lib/libpcap.a $($RUNNER_TEMP/pcap/bin/pcap-config --static-pcap-only --additional-libs)"
          make -j3
          make check
      - name: Verify binary and package
        run: |
          file arp-scan
          lipo arp-scan -verify_arch x86_64
          otool -l arp-scan | grep -A 4 LC_BUILD_VERSION
          otool -L arp-scan
          if otool -L arp-scan | tail -n +2 | awk '{print $1}' | grep -Ev '^(/usr/lib/|/System/Library/)'; then
            echo 'Unexpected non-system dynamic dependency' >&2
            exit 1
          fi
          if otool -L arp-scan | grep -i libpcap; then
            echo 'libpcap was not linked statically' >&2
            exit 1
          fi
          ./arp-scan --version
          make install DESTDIR="$RUNNER_TEMP/arp-scan"
          chmod u-s "$RUNNER_TEMP/arp-scan/usr/local/bin/arp-scan"
          tar -C "$RUNNER_TEMP/arp-scan" -czf arp-scan-macos13-intel.tar.gz usr/local
      - uses: actions/upload-artifact@v4
        with:
          name: arp-scan-macos13-intel
          path: arp-scan-macos13-intel.tar.gz
          if-no-files-found: error
